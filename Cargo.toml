[package]
name = "rebake"
version = "0.12.1"
edition = "2024"
description = "Rebake your Claude Code setup on any machine from a cookbook of install recipes"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2.190"
ratatui = "0.30"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
